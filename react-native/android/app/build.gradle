apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
    debuggableVariants = []
}

def originalApp = rootProject.file("../../android/src/main")
def transportSources = layout.buildDirectory.dir("generated/trackpadTransport")
def sharedSources = tasks.register("syncTrackpadTransport", Sync) {
    from(new File(originalApp, "java")) {
        include("com/nullptr/trackpad/TrackpadConnection.kt")
    }
    into(transportSources)
}
tasks.named("preBuild").configure { dependsOn(sharedSources) }

android {
    namespace "com.nullptr.trackpad.reactnative"
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        applicationId "com.nullptr.trackpad.reactnative"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
    }

    sourceSets.main.res.srcDir(new File(originalApp, "res"))
    sourceSets.main.java.srcDir(transportSources)
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("com.journeyapps:zxing-android-embedded:4.3.0")
}
