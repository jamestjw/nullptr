name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Set Android release version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo "::error::Expected a stable version tag in the form vMAJOR.MINOR.PATCH."
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          code=$((major * 1000000 + minor * 1000 + patch))
          if (( code < 1 || code > 2100000000 )); then
            echo "::error::Version tag is outside the supported Android version code range."
            exit 1
          fi
          printf 'ANDROID_VERSION_NAME=%s\nANDROID_VERSION_CODE=%s\n' "$version" "$code" >> "$GITHUB_ENV"
      - name: Build and lint Android app
        run: ./gradlew --no-daemon :android:assembleDebug :android:lintDebug
      - name: Upload debug APK
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-debug-apk
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
      - name: Build release APK
        if: github.ref_type == 'tag'
        run: ./gradlew --no-daemon :android:assembleRelease
      - name: Sign release APK
        if: github.ref_type == 'tag'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Configure the Android release signing secrets before pushing a release tag."
            exit 1
          fi
          umask 077
          keystore=$(mktemp "$RUNNER_TEMP/nullptr-release.XXXXXX")
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          mkdir -p dist
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$apksigner" sign --ks "$keystore" --ks-type PKCS12 --ks-key-alias nullptr \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --v4-signing-enabled false \
            --out "dist/nullptr-android-${GITHUB_REF_NAME}.apk" \
            android/build/outputs/apk/release/android-release-unsigned.apk
          "$apksigner" verify "dist/nullptr-android-${GITHUB_REF_NAME}.apk"
      - name: Upload release APK
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-release-apk
          path: dist/nullptr-android-*.apk
          if-no-files-found: error

  companion:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: companion/go.mod
          cache-dependency-path: companion/go.sum
      - name: Install X11 development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxkbcommon-dev
      - name: Test and build companion
        working-directory: companion
        env:
          CGO_ENABLED: '1'
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: |
          go test -race ./...
          go vet ./...
          mkdir -p build
          go build -trimpath -o build/nullptr-companion .
          ./build/nullptr-companion --help
      - name: Package companion
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          version="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          fi
          mkdir -p dist
          tar -C companion/build -czf "dist/nullptr-companion-${PLATFORM}-${version}.tar.gz" nullptr-companion
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: companion-${{ matrix.platform }}
          path: dist/nullptr-companion-${{ matrix.platform }}-*.tar.gz
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [android, companion]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        shell: bash
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="nullptr-android-${GITHUB_REF_NAME}.apk"
          companions=(
            "nullptr-companion-linux-x86_64-${GITHUB_REF_NAME}.tar.gz"
            "nullptr-companion-macos-arm64-${GITHUB_REF_NAME}.tar.gz"
            "nullptr-companion-macos-x86_64-${GITHUB_REF_NAME}.tar.gz"
          )
          sha256sum "$apk" "${companions[@]}" > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes "$apk" "${companions[@]}" SHA256SUMS.txt
