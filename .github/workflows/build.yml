name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android (${{ matrix.app }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Kotlin
            directory: .
            module: android
            java-version: '21'
            sdk-packages: 'platforms;android-35 build-tools;35.0.0'
            artifact: android
            debug-tasks: ':android:assembleDebug :android:lintDebug'
          - app: React Native
            directory: react-native/android
            module: app
            java-version: '17'
            sdk-packages: 'platforms;android-36 build-tools;35.0.0 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1'
            artifact: android-react-native
            debug-tasks: ':app:assembleDebug'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: ${{ matrix.sdk-packages }}
          log-accepted-android-sdk-licenses: 'false'
      - uses: actions/setup-node@v6
        if: matrix.app == 'React Native'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: react-native/package-lock.json
      - name: Install and type-check React Native dependencies
        if: matrix.app == 'React Native'
        working-directory: react-native
        run: |
          npm ci
          npm run typecheck
      - name: Set Android release version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo "::error::Expected a stable version tag in the form vMAJOR.MINOR.PATCH."
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          code=$((major * 1000000 + minor * 1000 + patch))
          if (( code < 1 || code > 2100000000 )); then
            echo "::error::Version tag is outside the supported Android version code range."
            exit 1
          fi
          printf 'ANDROID_VERSION_NAME=%s\nANDROID_VERSION_CODE=%s\n' "$version" "$code" >> "$GITHUB_ENV"
      - name: Run Android debug checks
        working-directory: ${{ matrix.directory }}
        run: ./gradlew --no-daemon ${{ matrix.debug-tasks }}
      - name: Upload debug APK
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}-debug-apk
          path: ${{ matrix.directory }}/${{ matrix.module }}/build/outputs/apk/debug/${{ matrix.module }}-debug.apk
          if-no-files-found: error
      - name: Build release APK
        if: github.ref_type == 'tag'
        working-directory: ${{ matrix.directory }}
        run: ./gradlew --no-daemon :${{ matrix.module }}:assembleRelease
      - name: Sign release APK
        if: github.ref_type == 'tag'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          UNSIGNED_APK: ${{ matrix.directory }}/${{ matrix.module }}/build/outputs/apk/release/${{ matrix.module }}-release-unsigned.apk
          RELEASE_APK: dist/nullptr-${{ matrix.artifact }}-${{ github.ref_name }}.apk
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Configure the Android release signing secrets before pushing a release tag."
            exit 1
          fi
          umask 077
          keystore=$(mktemp "$RUNNER_TEMP/nullptr-release.XXXXXX")
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          mkdir -p dist
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$apksigner" sign --ks "$keystore" --ks-type PKCS12 --ks-key-alias nullptr \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --v4-signing-enabled false \
            --out "$RELEASE_APK" "$UNSIGNED_APK"
          "$apksigner" verify "$RELEASE_APK"
      - name: Upload release APK
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}-release-apk
          path: dist/nullptr-${{ matrix.artifact }}-${{ github.ref_name }}.apk
          if-no-files-found: error

  companion:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: companion/go.mod
          cache-dependency-path: companion/go.sum
      - name: Install X11 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxkbcommon-dev
      - name: Test and build companion
        working-directory: companion
        run: |
          go test -race ./...
          go vet ./...
          mkdir -p build
          go build -trimpath -o build/nullptr-companion .
      - name: Package Linux companion
        shell: bash
        run: |
          version="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          fi
          mkdir -p dist
          tar -C companion/build -czf "dist/nullptr-companion-linux-x86_64-${version}.tar.gz" nullptr-companion
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: companion-linux-x86_64
          path: dist/nullptr-companion-linux-x86_64-*.tar.gz
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [android, companion]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        shell: bash
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="nullptr-android-${GITHUB_REF_NAME}.apk"
          react_native_apk="nullptr-android-react-native-${GITHUB_REF_NAME}.apk"
          companion="nullptr-companion-linux-x86_64-${GITHUB_REF_NAME}.tar.gz"
          sha256sum "$apk" "$react_native_apk" "$companion" > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes "$apk" "$react_native_apk" "$companion" SHA256SUMS.txt
